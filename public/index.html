<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slitz — Service Status</title>
<link rel="icon" type="image/png" href="/status-banner.png" />
<style>
  :root {
    --bg-0: #0b0d14;
    --bg-1: #12151f;
    --bg-2: #191d2c;
    --border: #262b3d;
    --text: #e7eaf3;
    --muted: #9aa3bd;
    --accent: #7c5cff;
    --accent-2: #3dd6ff;
    --ok: #3ddc84;
    --warn: #ffb020;
    --err: #ff5b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,0.18), transparent 60%),
                radial-gradient(1000px 500px at 110% 10%, rgba(61,214,255,0.12), transparent 60%),
                var(--bg-0);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .hero {
    text-align: center;
    margin-bottom: 32px;
  }
  .banner-wrap {
    display: inline-block;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(124,92,255,0.25), 0 4px 20px rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    background: linear-gradient(135deg, #1a1530 0%, #0e1220 100%);
    max-width: 100%;
  }
  .banner {
    display: block;
    width: 100%;
    max-width: 720px;
    height: auto;
  }
  h1 {
    font-size: 28px;
    margin: 24px 0 6px;
    letter-spacing: 0.2px;
  }
  .subtitle {
    color: var(--muted);
    margin: 0;
    font-size: 15px;
  }

  .overall {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 24px;
  }
  .overall-left { display: flex; align-items: center; gap: 14px; }
  .pulse-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 rgba(61,220,132,0.7);
    animation: pulse 1.8s infinite;
  }
  .pulse-dot.warn { background: var(--warn); box-shadow: 0 0 0 0 rgba(255,176,32,0.7); animation-name: pulse-warn; }
  .pulse-dot.err  { background: var(--err);  box-shadow: 0 0 0 0 rgba(255,91,107,0.7); animation-name: pulse-err; }
  @keyframes pulse      { 0% { box-shadow:0 0 0 0 rgba(61,220,132,0.6);} 70%{box-shadow:0 0 0 12px rgba(61,220,132,0);} 100%{box-shadow:0 0 0 0 rgba(61,220,132,0);} }
  @keyframes pulse-warn { 0% { box-shadow:0 0 0 0 rgba(255,176,32,0.6);} 70%{box-shadow:0 0 0 12px rgba(255,176,32,0);} 100%{box-shadow:0 0 0 0 rgba(255,176,32,0);} }
  @keyframes pulse-err  { 0% { box-shadow:0 0 0 0 rgba(255,91,107,0.6);} 70%{box-shadow:0 0 0 12px rgba(255,91,107,0);} 100%{box-shadow:0 0 0 0 rgba(255,91,107,0);} }
  .overall-label {
    font-size: 15px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .overall-status { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .overall-meta { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .overall-meta strong { color: var(--text); }

  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin: 8px 4px 12px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { border-color: #363c55; transform: translateY(-1px); }
  .card .icon { font-size: 26px; line-height: 1; width: 36px; text-align: center; }
  .card .name {
    font-size: 16px; font-weight: 600;
  }
  .card .meta {
    font-size: 13px; color: var(--muted); margin-top: 2px;
  }
  .card .right {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ping {
    font-size: 18px; font-weight: 600; color: var(--ok);
  }
  .ping.warn { color: var(--warn); }
  .ping.err { color: var(--err); }
  .status-text {
    font-size: 13px; color: var(--muted); margin-top: 2px;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge.ok { background: rgba(61,220,132,0.12); color: var(--ok); border: 1px solid rgba(61,220,132,0.3); }
  .badge.warn { background: rgba(255,176,32,0.12); color: var(--warn); border: 1px solid rgba(255,176,32,0.3); }
  .badge.err { background: rgba(255,91,107,0.12); color: var(--err); border: 1px solid rgba(255,91,107,0.3); }

  .footer {
    margin-top: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .footer a { color: var(--accent-2); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  .skeleton {
    height: 14px; width: 80px; background: linear-gradient(90deg, #1d2233, #282e44, #1d2233);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: 6px;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  @media (max-width: 540px) {
    .overall { flex-direction: column; align-items: flex-start; }
    .overall-meta { text-align: left; }
    .card { flex-direction: column; align-items: flex-start; }
    .card .right { text-align: left; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="banner-wrap">
        <img class="banner" src="/status-banner.png" alt="Slitz status banner" />
      </div>
      <h1>Service Status</h1>
      <p class="subtitle">Live health and latency for Slitz and its upstream APIs.</p>
    </section>

    <section class="overall" aria-live="polite">
      <div class="overall-left">
        <div class="pulse-dot" id="pulse"></div>
        <div>
          <div class="overall-label">Current Status</div>
          <div class="overall-status" id="overall-status">Checking…</div>
        </div>
      </div>
      <div class="overall-meta">
        <div>Last checked: <strong id="last-checked">—</strong></div>
        <div>Next refresh in: <strong id="next-in">—</strong></div>
        <div>Checks run automatically every <strong>15s</strong></div>
      </div>
    </section>

    <div class="section-title">Services</div>
    <div class="card-list" id="cards">
      <!-- Skeletons -->
      <div class="card"><div class="icon">⏳</div><div><div class="name">Loading…</div><div class="meta"><div class="skeleton"></div></div></div><div class="right"><div class="skeleton"></div></div></div>
      <div class="card"><div class="icon">⏳</div><div><div class="name">Loading…</div><div class="meta"><div class="skeleton"></div></div></div><div class="right"><div class="skeleton"></div></div></div>
      <div class="card"><div class="icon">⏳</div><div><div class="name">Loading…</div><div class="meta"><div class="skeleton"></div></div></div><div class="right"><div class="skeleton"></div></div></div>
    </div>

    <div class="footer">
      <div>Endpoints: <a href="/health">/health</a> · <a href="/ready">/ready</a> · <a href="/api/status">/api/status</a></div>
      <div style="margin-top:6px;">© Slitz · Auto-refreshing status monitor</div>
    </div>
  </main>

<script>
(function () {
  const REFRESH_MS = 15000;
  const cardsEl = document.getElementById('cards');
  const overallEl = document.getElementById('overall-status');
  const pulseEl = document.getElementById('pulse');
  const lastEl = document.getElementById('last-checked');
  const nextEl = document.getElementById('next-in');

  let nextRefreshAt = 0;
  let tickTimer = null;

  function tierBadge(status) {
    if (status === 'ok')       return { cls: 'ok',  label: 'Operational' };
    if (status === 'degraded') return { cls: 'warn', label: 'Degraded' };
    return { cls: 'err', label: 'Offline' };
  }

  function overallBadge(overall) {
    if (overall === 'operational') return { cls: 'ok',  text: 'All systems operational',      dotCls: '' };
    if (overall === 'degraded')    return { cls: 'warn', text: 'Some systems degraded',        dotCls: 'warn' };
    return { cls: 'err', text: 'Major outage detected', dotCls: 'err' };
  }

  function renderCard(svc) {
    const tier = tierBadge(svc.status);
    let rightHTML = '';
    if (svc.ping != null) {
      const pingCls = svc.status === 'ok' ? '' : (svc.status === 'degraded' ? 'warn' : 'err');
      rightHTML = `<div class="ping ${pingCls}">${svc.ping}ms</div>`;
    } else {
      rightHTML = `<div class="ping err">—</div>`;
    }
    const metaBits = [];
    if (svc.detail) metaBits.push(svc.detail);
    if (svc.httpStatus) metaBits.push(`HTTP ${svc.httpStatus}`);
    if (svc.degradedReason) metaBits.push(svc.degradedReason);
    if (svc.error && svc.status === 'offline') metaBits.push(svc.error);

    return `
      <div class="card" data-service="${escapeHtml(svc.name)}">
        <div style="display:flex; align-items:center; gap:14px; flex:1;">
          <div class="icon" aria-hidden="true">${svc.icon}</div>
          <div>
            <div class="name">${escapeHtml(svc.name)}</div>
            <div class="meta">${escapeHtml(metaBits.join(' · ') || 'No additional details')}</div>
          </div>
        </div>
        <div class="right">
          ${rightHTML}
          <div class="status-text"><span class="badge ${tier.cls}">${tier.label}</span></div>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch { return '—'; }
  }

  function render(data) {
    cardsEl.innerHTML = data.services.map(renderCard).join('');
    const overall = overallBadge(data.summary.overall);
    overallEl.textContent = overall.text;
    overallEl.className = 'overall-status';
    pulseEl.className = 'pulse-dot ' + overall.dotCls;
    lastEl.textContent = formatTime(data.timestamp);
  }

  function renderError(err) {
    overallEl.textContent = 'Unable to reach status API';
    pulseEl.className = 'pulse-dot err';
    cardsEl.innerHTML = `
      <div class="card">
        <div class="icon">⚠️</div>
        <div>
          <div class="name">Status API unreachable</div>
          <div class="meta">${escapeHtml(err?.message || 'Network error')} · Retrying shortly…</div>
        </div>
        <div class="right"><div class="ping err">—</div><div class="status-text"><span class="badge err">Error</span></div></div>
      </div>
    `;
  }

  async function refresh() {
    try {
      const res = await fetch('/api/status', { cache: 'no-store', headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      render(data);
    } catch (e) {
      renderError(e);
    } finally {
      nextRefreshAt = Date.now() + REFRESH_MS;
    }
  }

  function tick() {
    const ms = Math.max(0, nextRefreshAt - Date.now());
    nextEl.textContent = Math.ceil(ms / 1000) + 's';
  }

  refresh();
  tickTimer = setInterval(() => {
    if (Date.now() >= nextRefreshAt) refresh();
    tick();
  }, 250);
})();
</script>
</body>
</html>
